# Don't advertise the exact Apache/PHP build (passive fingerprinting). ServerTokens is set at
# server scope; this conf loads before Debian's security.conf, so the Dockerfile also pins it
# there to be sure it wins.
ServerTokens Prod
ServerSignature Off

# Deny direct HTTP access to sensitive / version-disclosing / backup files. wp-config.php is
# executed (never served) but denying it is defence-in-depth; *.sql covers any stray DB dump
# (the cutover backup now lands outside the webroot, but block it regardless); readme.html /
# license.txt leak the exact WordPress version for targeted CVE selection.
<FilesMatch "(?i)(^wp-config\.php$|^\.env|\.sql$|\.sql\.gz$|^readme\.html$|^license\.txt$)">
    Require all denied
</FilesMatch>

# WordPress pretty-permalink rewrites at the VHOST level, so routing to index.php does NOT
# depend on a /var/www/html/.htaccess file existing. WP only writes .htaccess when permalinks
# are saved/flushed; if that file is ever missing on the persistent volume (a fresh Coolify
# volume, a flush that didn't run, a wiped uploads mount), EVERY pretty URL — category archives,
# pages, the plugin's virtual routes (ads.txt, robots.txt, wp-sitemap.xml, the PWA manifest) —
# 404s from Apache before reaching PHP, while the bare "/" still works via DirectoryIndex. That
# masquerades as "the site is up" while ads.txt (which AdSense fetches) is a hard 404. The base
# wordpress image already sets AllowOverride All + enables mod_rewrite, so a real .htaccess still
# layers on top of this idempotently; these rules just guarantee the fallback is always present.
<Directory /var/www/html>
    Options +FollowSymLinks
    AllowOverride All
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </IfModule>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    # HSTS — the site is served over HTTPS via the proxy. Kept conservative (no
    # includeSubDomains / preload) until every ibnbatoutaweb.com subdomain is confirmed HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"

    <FilesMatch "\.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    <FilesMatch "\.(?:html|xml|txt)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType image/x-icon "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresDefault "access plus 5 minutes"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml
</IfModule>
